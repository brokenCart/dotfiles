# networkmanager-dmenu: Wi-Fi picker opened by clicking Wi-Fi in waybar.
# Shows up in wofi, so it inherits the launcher's Catppuccin style.

[dmenu]
dmenu_command = wofi --dmenu --insensitive --prompt "Wi-Fi" --width 520 --lines 14
# Nerd Font signal bars, weakest to strongest
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {icon}  {name:<{max_len_name}s}  {sec}
active_chars = ✓
compact = True
list_saved = False

[dmenu_passphrase]
obscure = True

[editor]
# "Edit connections" opens the GTK editor
gui_if_available = True
terminal = kitty

[nmdm]
rescan_delay = 3
