# hypridle — dim, lock, screen off (no auto-suspend)
# Paused while the Waybar idle inhibitor (eye icon) is on, or while media is playing.

general {
    lock_cmd         = pidof hyprlock || hyprlock          # don't start a second lock screen
    before_sleep_cmd = loginctl lock-session               # lock before suspend
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms("on")' # wake the display after resume
}

# 2.5 min: dim the screen
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 5 min: lock
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: turn the display off
listener {
    timeout    = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")' && brightnessctl -r
}
