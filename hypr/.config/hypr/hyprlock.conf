# hyprlock — styled to match the Waybar palette
# Clear the password field: Esc, Ctrl+U or Ctrl+Backspace

$font   = JetBrainsMono Nerd Font
$fg     = rgb(cdd6f4)
$muted  = rgb(7f849c)
$accent = rgb(89dceb)
$crit   = rgb(f38ba8)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Time
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $accent
    font_size = 20
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 12

    inner_color = rgba(17, 17, 27, 0.85)
    outer_color = rgba(49, 50, 68, 0.75)
    check_color = $accent
    fail_color  = $crit
    font_color  = $fg

    font_family = $font
    placeholder_text = <span foreground="##7f849c">Password</span>
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_spacing = 0.3

    position = 0, -40
    halign = center
    valign = center
}
