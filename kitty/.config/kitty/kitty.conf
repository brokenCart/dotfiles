# ─────────────────────────────────────────────────────────────
#  kitty — Catppuccin Mocha, matched to Waybar / Hyprland
#  Reload live: ctrl+shift+f5   ·   Debug: kitty --debug-config
# ─────────────────────────────────────────────────────────────

# ---------- Font ----------
font_family       JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         11.5
# ligatures on, but off under the cursor so you can edit "->" etc.
disable_ligatures cursor
modify_font       cell_height 115%
text_composition_strategy 1.2 10

# ---------- Window ----------
window_padding_width   10 14
placement_strategy     center
hide_window_decorations yes
confirm_os_window_close 0
# translucent like the Waybar pills; Hyprland blur shows through
background_opacity     0.88
dynamic_background_opacity yes
background_blur        1

# ---------- Cursor ----------
cursor_shape           beam
cursor_beam_thickness  1.8
cursor_blink_interval  0.6
cursor_stop_blinking_after 10
cursor_trail           3
cursor_trail_decay     0.08 0.3
cursor_trail_start_threshold 2

# ---------- Scrollback / mouse ----------
scrollback_lines       10000
scrollbar              scrolled
scrollbar_interactive  yes
scrollbar_handle_color #89dceb
scrollbar_handle_opacity 0.5
url_style              curly
detect_urls            yes
copy_on_select         yes
strip_trailing_spaces  smart
mouse_hide_wait        2.0

# ---------- Bell ----------
enable_audio_bell      no
visual_bell_duration   0.0
window_alert_on_bell   yes

# ---------- Splits ----------
enabled_layouts        splits,stack,tall
window_border_width    1.5pt
window_margin_width    0
single_window_margin_width -1
draw_minimal_borders   yes
inactive_text_alpha    0.75
active_border_color    #89dceb
inactive_border_color  #45475a
bell_border_color      #f9e2af

# ---------- Tab bar (powerline “pills”) ----------
tab_bar_edge           bottom
tab_bar_style          powerline
tab_powerline_style    round
tab_bar_min_tabs       2
tab_bar_margin_width   6
tab_bar_margin_height  4 0
tab_title_template     "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}  {title[:28]}{' ' + layout_name[0].upper() if num_windows > 1 else ''}"
active_tab_font_style  bold
inactive_tab_font_style normal
bell_on_tab            "󰂞 "
tab_activity_symbol    "● "

# ─────────────────────────────────────────────────────────────
#  Colours — Catppuccin Mocha (accent: sky #89dceb)
# ─────────────────────────────────────────────────────────────
foreground              #cdd6f4
background              #11111b
selection_foreground    #11111b
selection_background    #89dceb
cursor                  #89dceb
cursor_text_color       #11111b
url_color               #89b4fa

active_tab_foreground   #11111b
active_tab_background   #89dceb
inactive_tab_foreground #a6adc8
inactive_tab_background #313244
tab_bar_background      #11111b

mark1_foreground #11111b
mark1_background #b4befe
mark2_foreground #11111b
mark2_background #cba6f7
mark3_foreground #11111b
mark3_background #74c7ec

# black
color0  #45475a
color8  #585b70
# red
color1  #f38ba8
color9  #f38ba8
# green
color2  #a6e3a1
color10 #a6e3a1
# yellow
color3  #f9e2af
color11 #f9e2af
# blue
color4  #89b4fa
color12 #89b4fa
# magenta
color5  #f5c2e7
color13 #f5c2e7
# cyan
color6  #94e2d5
color14 #94e2d5
# white
color7  #bac2de
color15 #a6adc8

# ---------- Keys ----------
map ctrl+shift+enter   launch --location=split --cwd=current
map ctrl+shift+\       launch --location=vsplit --cwd=current
map ctrl+shift+'       launch --location=hsplit --cwd=current
map ctrl+shift+t       new_tab_with_cwd
map ctrl+shift+x       toggle_layout stack
map alt+left           neighboring_window left
map alt+right          neighboring_window right
map alt+up             neighboring_window up
map alt+down           neighboring_window down
map ctrl+shift+equal   change_font_size all +1.0
map ctrl+shift+0       change_font_size all 0
map ctrl+shift+a>m     set_background_opacity +0.05
map ctrl+shift+a>l     set_background_opacity -0.05
map ctrl+shift+a>1     set_background_opacity 1
map ctrl+shift+a>d     set_background_opacity default
