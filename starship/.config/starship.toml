#:schema https://starship.rs/config-schema.json
# Starship prompt — Catppuccin Mocha with the sky accent used across Hyprland/waybar/kitty
#
#  ╭─  ~/.config   main ✓   v1.23     took 3s
#  ╰─❯

palette = "catppuccin_mocha"
add_newline = true
command_timeout = 800

format = """
[╭─](surface2)\
$os\
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$c\
$java\
$lua\
$docker_context\
$cmd_duration\
$fill\
$jobs\
$status\
$time
[╰─](surface2)$character"""

# ── Prompt symbol ────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold sky)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[fill]
symbol = " "

# ── OS / directory ───────────────────────────────────────────────
[os]
disabled = false
style = "bold sky"
format = "[$symbol]($style) "

[os.symbols]
Arch = "󰣇"
Linux = ""

[directory]
style = "bold sky"
read_only = " 󰌾"
read_only_style = "red"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
format = "[$path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = " Downloads"
"Pictures" = " Pictures"
"Music" = "󰝚 Music"
".config" = " .config"

# ── Git ──────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_state]
style = "bold yellow"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_status]
style = "bold peach"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# ── Languages (only shown inside matching projects) ──────────────
[python]
symbol = " "
style = "yellow"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "peach"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "sapphire"
format = "[$symbol($version )]($style)"

[c]
symbol = " "
style = "blue"
format = "[$symbol($version(-$name) )]($style)"

[java]
symbol = " "
style = "red"
format = "[$symbol($version )]($style)"

[lua]
symbol = " "
style = "blue"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "

# ── Right side ───────────────────────────────────────────────────
[cmd_duration]
min_time = 2000
style = "yellow"
format = "[ $duration]($style) "

[jobs]
symbol = " "
style = "bold blue"
format = "[$symbol$number]($style) "

[status]
disabled = false
symbol = "✘ "
style = "bold red"
format = "[$symbol$status]($style) "

[time]
disabled = false
style = "overlay1"
time_format = "%H:%M"
format = "[ $time]($style)"

# ── Palette ──────────────────────────────────────────────────────
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
